# XcodeGen spec: `xcodegen generate` writes ZapaKid.xcodeproj (not committed).
name: ZapaKid
options:
  bundleIdPrefix: ro.zapakid
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  ZapaKidKit:
    path: ZapaKidKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 9572LYGZ7S
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  ZapaKid:
    type: application
    platform: iOS
    sources: [ZapaKid]
    dependencies:
      - package: ZapaKidKit
    settings:
      base:
        # ro.zapakid.app since 2026-10-26 (team 9572LYGZ7S); extensions get ro.zapakid.app.<name>.
        PRODUCT_BUNDLE_IDENTIFIER: ro.zapakid.app
        PRODUCT_NAME: ZapaKid
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ZapaKid
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Sign in with Apple, Declared Age Range (is the parent 18+?), Data Protection Complete for all files, and
        # App Attest (development here; TestFlight and App Store builds always use the production environment).
        CODE_SIGN_ENTITLEMENTS: ZapaKid/ZapaKid.entitlements
  ZapaKidTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ZapaKidTests]
    dependencies:
      - target: ZapaKid
      - package: ZapaKidKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.zapakid.app.tests
        GENERATE_INFOPLIST_FILE: YES
  ZapaKidUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ZapaKidUITests]
    dependencies:
      - target: ZapaKid
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.zapakid.app.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: ZapaKid
schemes:
  ZapaKid:
    build:
      targets:
        ZapaKid: all
    test:
      gatherCoverageData: true
      targets:
        - ZapaKidTests
        - ZapaKidUITests
