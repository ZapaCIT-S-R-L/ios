# Checks every pull request and every push to main. No secrets are used here, so PRs from forks are safe.
#   changes  does this PR touch more than docs? (docs-only PRs skip the macOS job)
#   ios      the only macOS job: XcodeGen project, build and unit tests on an iOS simulator (scripts/test.sh unit);
#            on main also the UI tests. Our free org runs about 5 macOS jobs at once, so each PR uses one.
#   scripts  the Node scripts for the CLA check and release tags (npm test)
#   deps     OSV-Scanner: known vulnerabilities in the pinned Swift packages (ZapaKidKit/Package.resolved)
#   secrets  gitleaks scan of the whole history
#   cla      the PR author signed the CLA (CLA-SIGNATURES.md), or is ZapaCIT staff or a bot
#   lint     SwiftFormat and SwiftLint (Swift), actionlint (workflows)
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR cancels that PR's older run; runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # On a PR the checkout is the merge commit: HEAD^1 is the base branch. Docs = *.md, docs/, LICENSE.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          echo "$changed"
          if grep -qvE '^(docs/.*|.*\.md|LICENSE)$' <<<"$changed"; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed: $code" >> "$GITHUB_STEP_SUMMARY"

  ios:
    # Docs-only PRs skip this job; a skipped job reports success, so the required `ios` check still passes.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Intel (x64) for now: on 2026-10-26 jobs on macos-26 (arm64) were never picked up ("not acquired by Runner of
    # type hosted"); the cause was the org's limit of about 5 concurrent macOS jobs. Switch back to macos-26 (arm64,
    # faster) when that is reliable, here and in codeql.yml.
    runs-on: macos-26-intel
    timeout-minutes: 75
    env:
      # Pinned Xcode (the default on the macOS 26 images, latest stable). Bump it in a PR.
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      # A simulator the image ships (runner-images macos-26 readme, "Installed Simulators").
      SIM_DEVICE: iPhone 17
      SIM_OS: "26.5"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen (pinned release, checksum verified)
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - run: xcodebuild -version && xcodegen --version
      # PRs: build + unit tests. main: also the UI tests (scripts/ci-local.sh runs everything locally before a push).
      - run: scripts/test.sh "${{ github.event_name == 'pull_request' && 'unit' || 'all' }}"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: build/results
          retention-days: 7

  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm test

  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: scripts/osv-scan.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --no-banner --redact

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: SwiftFormat
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo --entrypoint swiftformat
          ghcr.io/nicklockwood/swiftformat:0.64.3@sha256:8e7a3738e5a2d5ebb572e9822f4d4d44f599fc51aaa33f2dc10d41cc4a850de0
          --lint .
      - name: SwiftLint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          ghcr.io/realm/swiftlint:0.65.1@sha256:f47e083201e47a136cda5ae847595bfe00226c444ca226fa74fa5dc648a9b057
          swiftlint lint --strict
      - name: actionlint
        run: >-
          docker run --rm -v "$PWD:/repo" -w /repo
          rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
          -color

  cla:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Staff come from CODEOWNERS on the base branch, not from the pull request.
      - run: git fetch --depth=1 origin "$BASE_REF" && git show "FETCH_HEAD:.github/CODEOWNERS" > "$RUNNER_TEMP/CODEOWNERS"
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
      - run: node scripts/cla-check.js
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
          CODEOWNERS_FILE: ${{ runner.temp }}/CODEOWNERS
