# CodeQL code scanning for the Swift code (built on macOS) and these workflows (Actions).
# Results show under Security → Code scanning. Free for public repositories.
name: codeql

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      DEVELOPER_DIR: ${{ startsWith(matrix.os, 'macos') && '/Applications/Xcode_26.6.app/Contents/Developer' || '' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            # Intel for now (no arm64 capacity on 2026-10-26); back to macos-26 when it returns, as in ci.yml.
            os: macos-26-intel
            build-mode: manual
          - language: actions
            os: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: Build the app for CodeQL
        if: matrix.language == 'swift'
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          "$RUNNER_TEMP/xcodegen/xcodegen/bin/xcodegen" generate --quiet
          xcodebuild build -project ZapaKid.xcodeproj -scheme ZapaKid -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO -quiet
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
