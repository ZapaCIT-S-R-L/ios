# Archives a signed Release build and uploads it to TestFlight (App Store Connect app ro.zapakid.app).
# Runs on every merge to main and by hand (Actions → testflight → Run workflow), from main only.
# Credentials live only in the protected `testflight` environment (Settings → Environments), see docs/testflight.md:
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8   App Store Connect API key (App Manager), .p8 as base64: the upload
#   DIST_CERT_P12, DIST_CERT_PASSWORD       Apple Distribution certificate (.p12 as base64) and its password
#   PROVISIONING_PROFILE                    App Store profile for ro.zapakid.app (.mobileprovision as base64)
# Until all six exist the job skips with a notice. Signing is manual (Stefan's choice, 2026-10-27): the certificate
# goes into a temporary keychain, the profile into this runner's profile folder, and all of it is deleted at the end.
name: testflight

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    # Intel like ci.yml until macos-26 (arm64) is reliable for this org.
    runs-on: macos-26-intel
    timeout-minutes: 90
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      DIST_CERT_P12: ${{ secrets.DIST_CERT_P12 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
    steps:
      - name: Check the signing secrets
        id: key
        run: |
          missing=""
          [ -n "$ASC_KEY_ID" ] || missing="$missing ASC_KEY_ID"
          [ -n "$ASC_ISSUER_ID" ] || missing="$missing ASC_ISSUER_ID"
          [ -n "$ASC_KEY_P8" ] || missing="$missing ASC_KEY_P8"
          [ -n "$DIST_CERT_P12" ] || missing="$missing DIST_CERT_P12"
          [ -n "$DIST_CERT_PASSWORD" ] || missing="$missing DIST_CERT_PASSWORD"
          [ -n "$PROVISIONING_PROFILE" ] || missing="$missing PROVISIONING_PROFILE"
          if [ -n "$missing" ]; then
            echo "::notice title=TestFlight skipped::The testflight environment is missing:$missing. See docs/testflight.md."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.key.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen (pinned release, checksum verified)
        if: steps.key.outputs.ready == 'true'
        env:
          XCODEGEN_VERSION: 2.46.0
          XCODEGEN_SHA256: 4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806
        run: |
          curl -fsSL -o "$RUNNER_TEMP/xcodegen.zip" \
            "https://github.com/yonaskolb/XcodeGen/releases/download/$XCODEGEN_VERSION/xcodegen.zip"
          echo "$XCODEGEN_SHA256  $RUNNER_TEMP/xcodegen.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/xcodegen.zip" -d "$RUNNER_TEMP/xcodegen"
          echo "$RUNNER_TEMP/xcodegen/xcodegen/bin" >> "$GITHUB_PATH"
      - name: Generate the project
        if: steps.key.outputs.ready == 'true'
        env:
          COCOAPODS_VERSION: 1.17.0
        run: |
          test "$(pod --version)" = "$COCOAPODS_VERSION" || { echo "CocoaPods $(pod --version), expected $COCOAPODS_VERSION"; exit 1; }
          xcodegen generate --quiet
          pod install --silent
      - name: Install the certificate and profile
        id: signing
        if: steps.key.outputs.ready == 'true'
        run: |
          umask 077
          KEYCHAIN="$RUNNER_TEMP/zapakid-signing.keychain-db"
          # A keychain only for this job, with a random password, locked again after an hour.
          keychain_password=$(openssl rand -base64 32)
          security create-keychain -p "$keychain_password" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN"
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/distribution.p12"
          security import "$RUNNER_TEMP/distribution.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/distribution.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          # The profile, under its UUID, where Xcode looks for it.
          printf '%s' "$PROVISIONING_PROFILE" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/profile.plist")
          name=$(plutil -extract Name raw "$RUNNER_TEMP/profile.plist")
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/profile.mobileprovision" "$dir/$uuid.mobileprovision"
          done
          rm -f "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
          echo "profile=$name" >> "$GITHUB_OUTPUT"
          echo "uuid=$uuid" >> "$GITHUB_OUTPUT"
          # The export step signs for the App Store with this profile.
          plutil -replace provisioningProfiles -json "{\"ro.zapakid.app\": \"$name\"}" \
            scripts/ExportOptions-TestFlight.plist
      - name: Write the key
        if: steps.key.outputs.ready == 'true'
        run: |
          umask 077
          printf '%s' "$ASC_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive (signed, Release)
        if: steps.key.outputs.ready == 'true'
        env:
          # Every upload needs a higher build number; the marketing version comes from project.yml.
          BUILD_NUMBER: ${{ github.run_number }}
          PROFILE: ${{ steps.signing.outputs.profile }}
        run: >-
          xcodebuild archive -workspace ZapaKid.xcworkspace -scheme ZapaKid -configuration Release
          -destination generic/platform=iOS -archivePath "$RUNNER_TEMP/ZapaKid.xcarchive"
          OTHER_CODE_SIGN_FLAGS="--keychain $RUNNER_TEMP/zapakid-signing.keychain-db"
          ZK_CODE_SIGN_STYLE=Manual ZK_CODE_SIGN_IDENTITY="Apple Distribution" ZK_PROVISIONING_PROFILE="$PROFILE"
          CURRENT_PROJECT_VERSION="$BUILD_NUMBER" -quiet
      - name: Upload to TestFlight
        if: steps.key.outputs.ready == 'true'
        run: >-
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/ZapaKid.xcarchive"
          -exportOptionsPlist scripts/ExportOptions-TestFlight.plist -exportPath "$RUNNER_TEMP/export"
          -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8"
          -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the signing files
        if: always() && steps.key.outputs.ready == 'true'
        env:
          UUID: ${{ steps.signing.outputs.uuid }}
        run: |
          security delete-keychain "$RUNNER_TEMP/zapakid-signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision"
          if [ -n "$UUID" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision" \
                  "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$UUID.mobileprovision"
          fi
          rm -rf "$RUNNER_TEMP/ZapaKid.xcarchive" "$RUNNER_TEMP/export"
